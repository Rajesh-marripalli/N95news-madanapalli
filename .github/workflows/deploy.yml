name: N95 News - YouTube, Gemini Telugu News and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write    # commit video/news JSON archives back to main for durable storage
  pages: write
  id-token: write

concurrency:
  group: n95-news-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Update latest and historical YouTube videos
        # On a temporary YouTube outage, keep the previous feed and still deploy.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_ARCHIVE_LIMIT: '500'
        run: npm run sync:youtube

      - name: Summarize spoken news with Gemini
        # Runs server-side, never exposes GEMINI_API_KEY in public Angular code.
        # Each public video is processed once; failures retain prior summaries.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_MAX_PER_RUN: '8'
        run: npm run summarize:news

      - name: Persist updated videos and summaries
        # Unlike Actions cache, committed JSON remains available on future runs.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/videos.json public/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh N95 news [skip ci]"
            git push origin HEAD:main
          else
            echo "No new video or summary data to commit."
          fi

      - name: Compute GitHub Pages base href
        id: base
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "${REPO_NAME,,}" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Angular 21
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      - name: SPA fallback and disable Jekyll
        run: |
          cp dist/n95-news/browser/index.html dist/n95-news/browser/404.html
          touch dist/n95-news/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/n95-news/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
